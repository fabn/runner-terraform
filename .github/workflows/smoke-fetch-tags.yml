name: Smoke fetch-tags

# TEMPORARY — delete before merging. Proves the actions/checkout@v7 behaviors
# the Release workflow depends on: tag visibility on a shallow checkout (via
# the fetch-tags option and via an explicit fetch) and pushing a tag with the
# persisted credentials (dry-run, nothing is written).

on:
  pull_request:

permissions:
  contents: write # needed by the push --dry-run auth check only

jobs:
  fetch-tags-option:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
      - name: Assert existing tags are visible
        run: |
          git tag --list 'v*'
          test "$(git tag --list 'v*' | wc -l)" -ge 11
          git rev-parse -q --verify refs/tags/v1.6.6

  explicit-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch tags explicitly and assert
        run: |
          git fetch --tags --quiet origin
          git tag --list 'v*'
          test "$(git tag --list 'v*' | wc -l)" -ge 11
          git rev-parse -q --verify refs/tags/v1.6.6
      - name: Dry-run a tag push (auth check for the Release workflow)
        run: git push --dry-run origin "refs/tags/v1.6.6:refs/tags/smoke-test"
